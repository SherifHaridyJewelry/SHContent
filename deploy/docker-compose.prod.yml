# Production Traefik stack for SHContent on Hostinger VPS
# Deploy path: /opt/shcontent/
# Project name must stay unique — do not use the default "deploy" (collides with SHFlow).
# Secrets: /etc/shcontent/.env (POSTGRES_PASSWORD). Compose must load it:
#   docker compose --env-file /etc/shcontent/.env ...

name: shcontent

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: shcontent
      POSTGRES_USER: shcontent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /etc/shcontent/.env}
    volumes:
      - shcontent_pgdata:/var/lib/postgresql/data
    networks:
      - shcontent_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shcontent -d shcontent"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: always
    env_file:
      - /etc/shcontent/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://shcontent:${POSTGRES_PASSWORD}@postgres:5432/shcontent
      DATA_ROOT: /data
      APP_ENV: production
    volumes:
      - shcontent_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shcontent_internal
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.shcontent-api.rule=Host(`workflow.srv1168072.hstgr.cloud`) && PathPrefix(`/api`)
      - traefik.http.routers.shcontent-api.tls=true
      - traefik.http.routers.shcontent-api.entrypoints=web,websecure
      - traefik.http.routers.shcontent-api.tls.certresolver=mytlschallenge
      - traefik.http.routers.shcontent-api.priority=10
      - traefik.http.services.shcontent-api.loadbalancer.server.port=8000

  web:
    image: nginx:alpine
    restart: always
    volumes:
      - /opt/shcontent/web/dist:/usr/share/nginx/html:ro
      - ../deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.shcontent-web.rule=Host(`workflow.srv1168072.hstgr.cloud`)
      - traefik.http.routers.shcontent-web.tls=true
      - traefik.http.routers.shcontent-web.entrypoints=web,websecure
      - traefik.http.routers.shcontent-web.tls.certresolver=mytlschallenge
      - traefik.http.routers.shcontent-web.priority=1
      - traefik.http.services.shcontent-web.loadbalancer.server.port=80

networks:
  shcontent_internal:
    driver: bridge
  root_default:
    external: true

volumes:
  shcontent_pgdata:
    external: true
    name: deploy_shcontent_pgdata
  shcontent_data:
    external: true
    name: deploy_shcontent_data
