# SHContent API — nginx site config for workflow subdomain
# Install: sudo cp deploy/nginx/shcontent.conf /etc/nginx/sites-available/shcontent
#          sudo ln -sf /etc/nginx/sites-available/shcontent /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream shcontent_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name workflow.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name workflow.yourdomain.com;

    # Certbot-managed certificates
    ssl_certificate     /etc/letsencrypt/live/workflow.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workflow.yourdomain.com/privkey.pem;

    client_max_body_size 100M;

    root /opt/shcontent/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://shcontent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/assets/images/ {
        proxy_pass http://shcontent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
