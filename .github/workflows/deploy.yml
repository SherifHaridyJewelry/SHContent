name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add known host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync application
        run: |
          rsync -avz --delete \
            --exclude .git \
            --exclude web/node_modules \
            --exclude web/dist \
            --exclude .kilo \
            --exclude images \
            --exclude exports \
            --exclude data \
            --exclude __pycache__ \
            --exclude .venv \
            --exclude .env \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/shcontent/
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=yes" \
            web/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/shcontent/web/dist/

      - name: Restart stack
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod -R a+rX /opt/shcontent/web/dist && cd /opt/shcontent/deploy && docker compose --env-file /etc/shcontent/.env -f docker-compose.prod.yml -f docker-compose.domains.yml up -d --build"

      - name: Verify health
        run: curl -sf https://workflow.sherifharidyjewelry.com/api/health
